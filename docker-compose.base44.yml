services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=3000
      --no-browser
      --allow-root
      --ServerApp.token=""
      --ServerApp.password=""
      --ServerApp.allow_origin="*"
      --ServerApp.allow_remote_access=True
      --ServerApp.disable_check_xsrf=True
      --notebook-dir=/app
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/lab').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
